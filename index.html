<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0a0e">
<title>Меню миксов</title>
<style>
:root{--bg:#0b0a0e;--card:#1d1b22;--card2:#26232c;--line:rgba(255,255,255,.08);--text:#f4efe6;--dim:#a49d93;--amber:#f2a93b;--green:#7fd18b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(242,169,59,.10),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(140,90,200,.08),transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 110px}
header h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.3px}
header p{margin:0;color:var(--dim);font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;outline:none}
.search:focus{border-color:rgba(242,169,59,.5)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600}
section{margin-top:22px}
section h2{font-size:19px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
section h2 small{color:var(--dim);font-weight:400;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:9px}
.card.hit{border-color:rgba(242,169,59,.35);background:linear-gradient(135deg,rgba(242,169,59,.10),transparent 60%),var(--card)}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.name{font-weight:650;font-size:16px}
.star{color:var(--amber);font-size:12px;font-weight:700;white-space:nowrap;margin-top:2px}
.fl{margin-top:5px;color:#ddd5c8;font-size:14.5px}
.fl span{white-space:nowrap}
.meta{margin-top:7px;display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12.5px}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16);display:block}
.dots i.on{background:var(--amber)}
.empty{color:var(--dim);text-align:center;padding:40px 0}
.more{display:block;width:100%;margin-top:4px;padding:10px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--dim);font-size:14px;cursor:pointer}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:10;border:0;border-radius:999px;padding:15px 26px;font-size:17px;font-weight:700;background:var(--amber);color:#1a1206;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:#16141a;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:760px;padding:20px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.panel h3{margin:0 0 4px;font-size:20px}
.panel .sub{color:var(--dim);font-size:13.5px;margin:0 0 14px}
.label{color:var(--dim);font-size:13px;margin:14px 0 6px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:var(--amber);color:#1a1206;font-size:17px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.4}
.result{margin-top:16px}
.result .card{border-color:rgba(242,169,59,.45)}
.hint{color:var(--dim);font-size:13px;text-align:center;margin-top:10px}
.close{float:right;border:0;background:var(--card2);color:var(--text);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Меню миксов</h1>
    <p id="count"></p>
  </header>
  <div class="bar">
    <input class="search" id="q" type="search" placeholder="Найти вкус: манго, кола, мята…" autocomplete="off">
    <div class="chips" id="strength"></div>
    <div class="chips" id="nav"></div>
  </div>
  <main id="list"></main>
  <footer>Обновлено 13 ноября, 23:38 · все миксы из того, что сейчас есть в наличии</footer>
</div>

<button class="fab" id="fab">🎲 Подбери мне</button>

<div class="sheet" id="sheet">
  <div class="panel">
    <button class="close" id="close" aria-label="Закрыть">✕</button>
    <h3>Подберём микс</h3>
    <p class="sub">Отметь, чего хочется, — выпадет микс из того, что есть сейчас.</p>
    <div class="label">Настроение (можно несколько)</div>
    <div class="grid" id="rmoods"></div>
    <div class="label">Крепость</div>
    <div class="grid" id="rstr"></div>
    <button class="go" id="spin">Крутить</button>
    <div class="result" id="result"></div>
  </div>
</div>

const STR = [{k:0,t:"Любая"},{k:1,t:"Лёгкие"},{k:2,t:"Средние"},{k:3,t:"Крепкие"}];
const STR_NAME = {1:"лёгкий",2:"средний",3:"крепкий"};
const moodBy = Object.fromEntries(MOODS.map(m => [m.k, m]));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

let strength = 0, query = "";
const PAGE = 12;
const shown = {};

function plural(n, a, b, c){const n10=n%10,n100=n%100;return n10==1&&n100!=11?a:(n10>=2&&n10<=4&&(n100<12||n100>14))?b:c}

function card(it){
  const fl = it.f.map(f => `<span>${f[0]} ${esc(f[1])}</span>`).join(" · ");
  const dots = [1,2,3].map(i => `<i class="${i<=it.s?"on":""}"></i>`).join("");
  const moods = Object.entries(it.m).filter(([k,v]) => v >= 25 && moodBy[k]).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([k]) => moodBy[k].t.toLowerCase()).join(", ");
  return `<div class="card${it.h?" hit":""}"><div class="top"><div class="name">${esc(it.n)}</div>${it.h?'<div class="star">★ ХИТ</div>':""}</div>
  <div class="fl">${fl}</div>
  <div class="meta"><span class="dots">${dots}</span><span>${STR_NAME[it.s]}</span>${moods?`<span>· ${esc(moods)}</span>`:""}</div></div>`;
}

function matches(it){
  if (strength && it.s !== strength) return false;
  if (!query) return true;
  const hay = (it.n + " " + it.f.map(f => f[1]).join(" ")).toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

function render(){
  const list = ITEMS.filter(matches);
  $("count").textContent = `${list.length} ${plural(list.length,"микс","микса","миксов")} можно заказать прямо сейчас`;
  const groups = [];
  const hits = list.filter(i => i.h);
  if (hits.length && !query) groups.push({k:"hits", t:"Хиты", e:"⭐️", items:hits});
  for (const m of MOODS) {
    const items = list.filter(i => i.sec === m.k);
    if (items.length) groups.push({k:m.k, t:m.t, e:m.e, items});
  }
  const other = list.filter(i => !moodBy[i.sec]);
  if (other.length) groups.push({k:"other", t:"Разное", e:"✨", items:other});

  $("nav").innerHTML = groups.map(g => `<button class="chip" data-go="${g.k}">${g.e} ${esc(g.t)} <span style="opacity:.6">${g.items.length}</span></button>`).join("");
  if (!list.length) { $("list").innerHTML = `<div class="empty">Ничего не нашлось. Попробуй другой вкус или крепость.</div>`; return; }
  $("list").innerHTML = groups.map(g => {
    const n = query ? g.items.length : (shown[g.k] || PAGE);
    const rest = g.items.length - n;
    return `<section id="s-${g.k}"><h2>${g.e} ${esc(g.t)} <small>${g.items.length}</small></h2>
      ${g.items.slice(0,n).map(card).join("")}
      ${rest>0?`<button class="more" data-more="${g.k}">Показать ещё ${rest}</button>`:""}</section>`;
  }).join("");
}

$("strength").innerHTML = STR.map(s => `<button class="chip${s.k===0?" on":""}" data-s="${s.k}">${s.t}</button>`).join("");
$("strength").onclick = e => {
  const b = e.target.closest("[data-s]"); if (!b) return;
  strength = +b.dataset.s;
  [...$("strength").children].forEach(c => c.classList.toggle("on", c === b));
  render();
};
$("nav").onclick = e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  const s = $("s-" + b.dataset.go);
  if (s) window.scrollTo({top: s.getBoundingClientRect().top + scrollY - $("q").closest(".bar").offsetHeight, behavior:"smooth"});
};
$("list").onclick = e => {
  const b = e.target.closest("[data-more]"); if (!b) return;
  const k = b.dataset.more;
  shown[k] = (shown[k] || PAGE) + 24;
  render();
};
let t; $("q").oninput = e => { clearTimeout(t); t = setTimeout(() => { query = e.target.value.trim().toLowerCase(); render(); }, 120); };

// «Подбери мне» — как рулетка в приложении: каждое выбранное настроение — минимум четверть чаши, с перевесом в сторону хитов
const pick = {moods:new Set(), s:0, recent:[]};
$("rmoods").innerHTML = MOODS.map(m => `<button class="chip" data-m="${m.k}">${m.e} ${esc(m.t)}</button>`).join("");
$("rstr").innerHTML = STR.map(s => `<button class="chip${s.k===0?" on":""}" data-rs="${s.k}">${s.t}</button>`).join("");
function cands(){ return ITEMS.filter(i => (!pick.s || i.s === pick.s) && [...pick.moods].every(m => (i.m[m]||0) >= 25)); }
function updSpin(){ const n = cands().length; $("spin").disabled = !n; $("spin").textContent = n ? `Крутить · ${n} ${plural(n,"вариант","варианта","вариантов")}` : "Таких миксов сейчас нет"; }
$("rmoods").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; const k = b.dataset.m;
  pick.moods.has(k) ? pick.moods.delete(k) : pick.moods.add(k); b.classList.toggle("on"); updSpin(); };
$("rstr").onclick = e => { const b = e.target.closest("[data-rs]"); if (!b) return; pick.s = +b.dataset.rs;
  [...$("rstr").children].forEach(c => c.classList.toggle("on", c === b)); updSpin(); };
$("spin").onclick = () => {
  const all = cands(); if (!all.length) return;
  const fresh = all.filter(i => !pick.recent.includes(i.n)); const list = fresh.length ? fresh : all;
  const total = list.reduce((a,i) => a + i.w, 0);
  let r = Math.random() * total, win = list[list.length-1];
  for (const i of list) { r -= i.w; if (r < 0) { win = i; break; } }
  pick.recent = [win.n, ...pick.recent].slice(0, 6);
  $("result").innerHTML = card(win) + `<div class="hint">Назови это название кальянщику · или крути ещё</div>`;
  $("spin").textContent = "Ещё вариант";
};
$("fab").onclick = () => { $("sheet").classList.add("open"); updSpin(); };
$("close").onclick = () => $("sheet").classList.remove("open");
$("sheet").onclick = e => { if (e.target === $("sheet")) $("sheet").classList.remove("open"); };

render();
</script>
